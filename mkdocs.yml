site_name: AGH
site_description: 可审计的多智能体重构框架
repo_url: https://github.com/Gray2006/AGH
theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - content.code.copy
nav:
  - 首页: index.md
  - 项目自审: what-it-proves.md
  - 研究记录: research.md
  - Research notes: research.en.md
  - 状态交接: STATUS.md
  - 动机映射: motivation.md
  - 接入指南: import-guide.md
  - Integration guide (EN): import-guide.en.md
  - 发布: release.md
  - 安全边界: security.md
  - M0 实现: M0-implementation.md
  - NATS 验证: verification-nats.md
  - 引用核验: verification-references.md
  - 模块 API: api.md
markdown_extensions:
  - tables
  - fenced_code
  - admonition
