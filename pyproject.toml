[project]
name = "AGH"
version = "1.20.0"
description = "Agent Gestalt Hierarchy (AGH): provenance-signed, budget-ledgered, replayable multi-agent reconstruction. M0 vertical slice."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "灰风 (Graywind)" }]
keywords = [
    "multi-agent",
    "llm",
    "provenance",
    "reproducibility",
    "pydantic",
    "gestalt",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.26",
    "jsonschema>=4.20",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/Gray2006/AGH"
Repository = "https://github.com/Gray2006/AGH"
Issues = "https://github.com/Gray2006/AGH/issues"
Changelog = "https://github.com/Gray2006/AGH/blob/main/CHANGELOG.md"

[project.scripts]
agh = "agh.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agh*"]

[tool.setuptools.package-data]
agh = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["agh", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
# 中文注释与文案里的全角标点是有意的，不当歧义字符处理
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["agh"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["agh.cli", "agh.pipeline", "agh.supervisor", "agh.bus_nats", "agh.contracts"]
ignore_errors = true
