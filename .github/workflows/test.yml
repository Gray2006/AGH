name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    env:
      NATS_URL: nats://127.0.0.1:4222
    steps:
      - uses: actions/checkout@v4
      - name: Start NATS with JetStream
        run: |
          docker run -d --name nats -p 4222:4222 -p 8222:8222 nats:2.10 -js -m 8222
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8222/healthz && break
            sleep 1
          done
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev,nats]"
      - name: Lint
        run: python -m ruff check .
      - name: Dead code check
        run: |
          pip install vulture
          python -m vulture agh --min-confidence 80
      - name: Unit tests
        run: python -m pytest --cov=agh --cov-report=term --cov-fail-under=88
      - name: Run M0 demo
        run: python -m agh

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Unit tests
        run: python -m pytest --cov=agh --cov-report=term --cov-fail-under=88
      - name: Run M0 demo
        run: python -m agh

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dev deps
        run: pip install -e ".[dev]" build
      - name: Build
        run: python -m build
      - name: Install wheel in a clean venv
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet dist/*.whl
      - name: User journey
        run: python scripts/smoke_journey.py
      - name: Smoke test the installed package
        run: |
          /tmp/venv/bin/agh version
          # doctor 在缺可选组件时会返回非零，这里只验证它能产出合法 JSON
          /tmp/venv/bin/agh doctor --json > /tmp/doctor.json || true
          python -c "import json,sys; d=json.load(open('/tmp/doctor.json')); sys.exit(0 if 'checks' in d else 1)"
          /tmp/venv/bin/agh quickstart --dir /tmp/qs
          /tmp/venv/bin/agh audit verify --log /tmp/qs/run.jsonl
          /tmp/venv/bin/agh ui --log /tmp/qs/run.jsonl --out /tmp/r.html --no-open
          test -s /tmp/r.html

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build docs
        run: |
          pip install mkdocs-material
          NO_MKDOCS_2_WARNING=1 python -m mkdocs build --strict
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  deploy-docs:
    needs: docs
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
